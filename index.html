<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prefect Monitor</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Deployment config, before the app: a classic script runs ahead of a module. -->
  <script src="config.js"></script>
</head>
<body>
  <!-- Filled in by src/header.js: one header, rendered into whichever page mounts it, so
       the picker and the clock cannot drift apart. The element stays here so the sticky bar
       paints on the first frame rather than a module later. -->
  <header></header>


  <div id="loading" aria-hidden="true"></div>
  <div id="err"></div>
  <div id="legend"></div>
  <div id="main">
    <div id="chart"></div>

    <!-- Outside #chart: rendering replaces that element's contents wholesale. -->
    <div id="dragSelect" hidden></div>

    <!-- Shown only while zoomed: the whole range as a track, the zoom as a draggable
         thumb, and a way back out. -->
    <div id="zoomBar" hidden>
      <div id="zoomTrack">
        <div id="zoomThumb" title="Drag to move the window"></div>
      </div>
      <button id="zoomReset" title="Back to the full range">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <line x1="6" y1="6" x2="18" y2="18"/>
          <line x1="18" y1="6" x2="6" y2="18"/>
        </svg>
      </button>
      <span id="zoomLabel" class="muted"></span>
    </div>
  </div>

  <div id="tooltip"></div>

  <div id="modal">
    <div id="modalCard">
      <div id="modalHeader">
        <b id="modalTitle"></b>
        <button id="modalClose">&#10005;</button>
      </div>
      <div id="modalChart"></div>
    </div>
  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
